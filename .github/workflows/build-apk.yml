name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Montar www
        run: |
          mkdir www
          cp -r index.html manifest.json sw.js icons www/
      - run: npx cap add android
      - run: npx cap sync android
      - name: Icones
        run: pip install pillow && python3 scripts/make-icons.py
      - name: Assinatura fixa (permite atualizar sem desinstalar)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Compilar
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Publicar APK na aba Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Pushdeck.apk
          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest Pushdeck.apk --title "Pushdeck APK" --notes "Build automático"
      - uses: actions/upload-artifact@v4
        with:
          name: Pushdeck-apk
          path: Pushdeck.apk
